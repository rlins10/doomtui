# Este arquivo foi gerenado para o DoomTui https://github.com/rlins10/doomtui.py
# Este diretórios aparecem nos campos de escolha do iwap, pwad e port
# Each directory should be on a separate line, preceded by Path=
# Cada diretório deve ser separado por linhas, com Path= na frente

# Não duplique os diretórios

[IWADSearch.Directories]
Path=$DOOMWADDIR

[PWAD.Directories]
Path=$HOME/games/zdoom/doom-pwad
Path=$HOME/games/zdoom/special
Path=$DOOMWADDIR/hh-pwad/HEXEN
Path=$DOOMWADDIR/hh-pwad/HERETIC

# Na indicação dos ports, você pode ou não usar o caminho
# completo, mas se não usar, o $PATH do sistema precisar achar
# aqueles que não tem o caminha especificado
[PORT.Directories]
Port=gzdoom
Port=uzdoom
Port=biaseddoom
Port=$DOOMWADDIR/zandronum/zandronum


